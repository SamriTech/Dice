<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="diceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Rounded 3D Dice Body -->
  <rect x="6" y="6" width="52" height="52" rx="14" ry="14" fill="url(#diceGrad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- Inset Pips (Face 5) -->
  <circle cx="20" cy="20" r="4.5" fill="#0f172a"/>
  <circle cx="44" cy="20" r="4.5" fill="#0f172a"/>
  <circle cx="32" cy="32" r="5.2" fill="#6366f1"/>
  <circle cx="20" cy="44" r="4.5" fill="#0f172a"/>
  <circle cx="44" cy="44" r="4.5" fill="#0f172a"/>
  <!-- Specular highlights on pips -->
  <circle cx="18.5" cy="18.5" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="42.5" cy="18.5" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="30.5" cy="30.5" r="1.8" fill="#ffffff" opacity="0.8"/>
  <circle cx="18.5" cy="42.5" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="42.5" cy="42.5" r="1.5" fill="#ffffff" opacity="0.6"/>
</svg>
